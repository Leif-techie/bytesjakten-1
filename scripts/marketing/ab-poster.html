<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Bytesjakten – A/B</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: linear-gradient(
          180deg,
          rgba(236, 253, 245, 0.95) 0%,
          #ffffff 55%,
          #ffffff 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: var(--pad-y, 88px) var(--pad-x, 64px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: var(--brand-gap, 56px);
      }

      .brand-icon {
        flex-shrink: 0;
        width: var(--icon-size, 68px);
        height: var(--icon-size, 68px);
        border-radius: 9999px;
        background: #059669;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
      }

      .brand-icon svg {
        width: calc(var(--icon-size, 68px) * 0.55);
        height: calc(var(--icon-size, 68px) * 0.55);
      }

      .brand-text {
        font-size: var(--brand-font, 38px);
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #18181b;
        line-height: 1.15;
      }

      .brand-text .suffix {
        font-weight: 500;
        color: #71717a;
      }

      .headline {
        max-width: var(--content-max, 920px);
        margin-bottom: var(--headline-gap, 40px);
        font-size: var(--headline-font, 50px);
        font-weight: 800;
        line-height: 1.18;
        letter-spacing: -0.03em;
        color: #18181b;
        text-align: center;
      }

      .cta {
        max-width: var(--content-max, 920px);
        padding: var(--cta-pad-y, 22px) var(--cta-pad-x, 36px);
        border-radius: 16px;
        background: #059669;
        color: #fff;
        font-size: var(--cta-font, 32px);
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.02em;
        text-align: center;
        box-shadow: 0 8px 24px rgba(5, 150, 105, 0.28);
      }

      body.layout-tall {
        justify-content: center;
      }

      body.layout-tall .brand {
        margin-bottom: calc(var(--brand-gap, 56px) + 16px);
      }

      body.layout-wide {
        justify-content: center;
        padding: 44px 56px;
      }

      body.layout-wide .brand {
        margin-bottom: 28px;
        --icon-size: 48px;
        --brand-font: 30px;
      }

      body.layout-wide .headline {
        font-size: 34px;
        margin-bottom: 24px;
      }

      body.layout-wide .cta {
        font-size: 24px;
        padding: 16px 28px;
      }
    </style>
  </head>
  <body>
    <div class="brand" aria-label="Bytesjakten mobilabonnemang">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" />
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
        </svg>
      </div>
      <p class="brand-text">
        Bytesjakten
        <span class="suffix"> | mobilabonnemang</span>
      </p>
    </div>

    <p class="headline" id="headline"></p>
    <p class="cta" id="cta"></p>
  </body>
</html>
